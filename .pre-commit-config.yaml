repos:
-   repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version. Optional: Rev can be a tag or git SHA
    rev: v0.11.6
    hooks:
        # Run the linter.
        - id: ruff
          args: [--fix]
        # Run the formatter.
        - id: ruff-format
-   repo: local
    hooks:
        # Type check with the project's mypy, the same run as CI.
        - id: mypy
          name: mypy
          entry: uv run --no-sync mypy src
          language: system
          types: [python]
          pass_filenames: false
