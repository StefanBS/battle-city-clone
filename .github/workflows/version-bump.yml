name: Version Bump

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

jobs:
  bump:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Determine bump type from labels
        id: bump-type
        run: |
          LABELS='${{ toJSON(github.event.pull_request.labels.*.name) }}'
          if echo "$LABELS" | grep -q '"release:major"'; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          elif echo "$LABELS" | grep -q '"release:minor"'; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          elif echo "$LABELS" | grep -q '"release:patch"'; then
            echo "type=patch" >> "$GITHUB_OUTPUT"
          else
            echo "type=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if no release label
        if: steps.bump-type.outputs.type == 'none'
        run: echo "No release label found. Skipping version bump."

      - name: Generate GitHub App token
        if: steps.bump-type.outputs.type != 'none'
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        if: steps.bump-type.outputs.type != 'none'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        if: steps.bump-type.outputs.type != 'none'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version-file: '.python-version'

      - name: Install uv
        if: steps.bump-type.outputs.type != 'none'
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2

      - name: Install build tools (bump-my-version)
        if: steps.bump-type.outputs.type != 'none'
        run: uv sync --locked --no-install-project --extra build

      - name: Configure git
        if: steps.bump-type.outputs.type != 'none'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        if: steps.bump-type.outputs.type != 'none'
        run: uv run --no-sync bump-my-version bump ${{ steps.bump-type.outputs.type }}

      - name: Push changes and tag
        if: steps.bump-type.outputs.type != 'none'
        run: git push --follow-tags
