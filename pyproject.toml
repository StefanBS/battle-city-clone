[project]
name = "battle-city-clone"
version = "1.2.1"
description = "Just a Battle City (NES) clone"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pygame",
    "loguru",
    "pytmx",
    "platformdirs",
]

[project.optional-dependencies]
dev = [
    "import-linter>=2.15",
    "mypy",
    "pre-commit",
    "pytest>=9.0.3",
    "pytest-cov>=6.1.1",
    "pytest-mock>=3.14.0",
    "ruff",
]
build = [
    "pyinstaller",
    "bump-my-version",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "UP"]
ignore = []

dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# The package layers of ADR 0008. Each layer imports only the layers below it;
# battle and cpu_partner are independent. Type-only imports count too.
[tool.importlinter]
root_package = "src"

[[tool.importlinter.contracts]]
name = "Packages are layered: shell, then battle and cpu_partner, then world_view, then core"
type = "layers"
layers = [
    "src.shell",
    "src.battle | src.cpu_partner",
    "src.world_view",
    "src.core",
]

[[tool.importlinter.contracts]]
name = "States and utils import none of the packages"
type = "forbidden"
source_modules = ["src.states", "src.utils"]
forbidden_modules = [
    "src.shell",
    "src.battle",
    "src.cpu_partner",
    "src.world_view",
    "src.core",
]

[[tool.mypy.overrides]]
module = ["pytmx", "pytmx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = [
    "src",
    "."
]

[tool.bumpversion]
current_version = "1.2.1"
commit = true
tag = true
tag_name = "v{new_version}"
message = "bump version {current_version} → {new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "installer/windows/battle-city.iss"
search = '#define MyAppVersion "{current_version}"'
replace = '#define MyAppVersion "{new_version}"'

[[tool.bumpversion.files]]
filename = "uv.lock"
search = '''
name = "battle-city-clone"
version = "{current_version}"
'''
replace = '''
name = "battle-city-clone"
version = "{new_version}"
'''
